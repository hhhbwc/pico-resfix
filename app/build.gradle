plugins {
    id 'com.android.application'
}

android {
    namespace 'com.picoxr.resfix'
    compileSdk 34

    defaultConfig {
        applicationId "com.picoxr.resfix"
        minSdk 29
        targetSdk 34
        versionCode 18
        versionName "1.17"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Vector's legacy bridge exposes the older API signature where hook helpers
    // return XC_MethodHook.Unhook. Keep this compile-only so it is never bundled.
    compileOnly files('libs/vector-legacy-xposed-api.jar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
